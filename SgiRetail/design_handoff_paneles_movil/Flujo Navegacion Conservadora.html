<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Flujo · Navegación por canal · Conservadora</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F4F1EA; font-family: 'Manrope', system-ui, sans-serif; }
  #root { width: 100%; height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-detail.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="flow" title="Flujo de navegación · Variación Conservadora" subtitle="Vista TOTAL → Detalle de canal → Detalle de elemento. Toca cualquier tarjeta para entrar al nivel siguiente.">
        <DCArtboard id="lvl1-total" label="① Vista TOTAL · entrada" width={440} height={1500}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 20, background: '#F4F1EA', minHeight: '100%' }}>
            <IOSDevice width={402} height={1460}>
              <VariationA />
            </IOSDevice>
          </div>
        </DCArtboard>

        <DCArtboard id="lvl2-tienda" label="② Detalle Canal · Tienda" width={440} height={1700}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 20, background: '#F4F1EA', minHeight: '100%' }}>
            <IOSDevice width={402} height={1660}>
              <ChannelDetailA channelId="tienda" />
            </IOSDevice>
          </div>
        </DCArtboard>

        <DCArtboard id="lvl3-store" label="③ Detalle Tienda · LC Barcelona L'Illa" width={440} height={1560}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 20, background: '#F4F1EA', minHeight: '100%' }}>
            <IOSDevice width={402} height={1520}>
              <StoreDetailA storeId="illa" />
            </IOSDevice>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="other-channels" title="Detalle de otros canales" subtitle="Mismo template — adaptado cuando el canal no tiene desglose por item (Online, Marketplaces, Corner ECI).">
        <DCArtboard id="ch-corner" label="Canal · Corner ECI" width={440} height={1200}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 20, background: '#F4F1EA', minHeight: '100%' }}>
            <IOSDevice width={402} height={1160}>
              <ChannelDetailA channelId="corner" />
            </IOSDevice>
          </div>
        </DCArtboard>

        <DCArtboard id="ch-online" label="Canal · Online" width={440} height={1200}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 20, background: '#F4F1EA', minHeight: '100%' }}>
            <IOSDevice width={402} height={1160}>
              <ChannelDetailA channelId="online" />
            </IOSDevice>
          </div>
        </DCArtboard>

        <DCArtboard id="ch-mkt" label="Canal · Marketplaces" width={440} height={1200}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 20, background: '#F4F1EA', minHeight: '100%' }}>
            <IOSDevice width={402} height={1160}>
              <ChannelDetailA channelId="mkt" />
            </IOSDevice>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
